[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watchlist-hit-reviewer"
version = "0.1.0"
description = "An agent that reviews OFAC watchlist hits from Footprint, clears only what code confirms, and sends the rest to an analyst"
requires-python = ">=3.10"
dependencies = [
  "golive-gate[claude]==0.1.1",
  "pyyaml>=6",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["watchlist"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"watchlist/reviewer.py" = ["E501"]
"scripts/build_demo.py" = ["E501"]
"scripts/backtest_parts.py" = ["E501"]
"scripts/make_cases.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["watchlist"]
known-third-party = ["golive_gate"]
