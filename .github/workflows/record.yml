name: Record a live run

# Calls Claude for every customer (review step and judge), saves the replies to recordings/,
# and commits them. Needs the ANTHROPIC_API_KEY secret.
on:
  workflow_dispatch:
    inputs:
      redo:
        description: "all = new review and judge replies; judge = keep the recorded reviews, grade them again"
        default: all
        type: choice
        options: [all, judge]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOLIVE_LIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Live run (3 runs of 40 customers, Claude review + Claude judge)
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "Set the ANTHROPIC_API_KEY repo secret first"; exit 1; }
          # fail fast if the judge cannot be called at all
          python -c "from golive_gate import ClaudeJudge; print(ClaudeJudge()('Reply with exactly this line: VERDICT: PASS - smoke test').text)"
          if [ "${{ inputs.redo }}" = "judge" ]; then
            rm -f recordings/judge.jsonl
            sed -i 's/agent:live_agent/agent:recorded_agent/' evals/golive.live.yml
          else
            rm -f recordings/reviewer.jsonl recordings/judge.jsonl
          fi
          set +e
          golive run evals/golive.live.yml --out reports/live
          code=$?
          set -e
          cat reports/live/report.md >> "$GITHUB_STEP_SUMMARY"
          # 0 go, 1 no-go, 2 partial are all results worth keeping; 3 is a config error
          test "$code" -ne 3
          # keep only a complete recording: 120 review calls (40 customers x 3 runs)
          test "$(wc -l < recordings/reviewer.jsonl)" -eq 120 || { echo "incomplete recording, not committing"; exit 1; }
          git checkout evals/golive.live.yml
      - name: Show every failed check with its reason
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("reports/live/results.json")
          if p.exists():
              for c in json.loads(p.read_text())["cases"]:
                  for r in c["runs"]:
                      for cid, v in r["verdicts"].items():
                          if v["result"] == "fail":
                              print(f"{c['id']} run {r['run']} {cid}: {v['reason']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-run
          path: |
            reports/live
            recordings
      - name: Rebuild the demo page from the recording
        # replay only: with GOLIVE_LIVE unset the judge replays the recording instead of grading again
        run: |
          if [ -f scripts/build_demo.py ]; then env -u GOLIVE_LIVE python scripts/build_demo.py; fi
      - name: Commit the recording
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recordings
          if [ -d docs ]; then git add docs; fi
          git commit -m "Record live run" || echo "nothing to commit"
          git push
